name: obtainium
description: Get Android app updates straight from the source.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.4.3+2335

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

dependencies:
  android_intent_plus: ^6.0.0
  android_package_installer: # TODO: See if PR will be accepted (dev may not be active), else remove this comment
    git:
      url: https://github.com/ImranR98/android_package_installer
      ref: main
  android_package_manager: # TODO: Make PR and switch to upstream
    git:
      url: https://github.com/ImranR98/android_package_manager
      ref: master
  android_system_font:
    git:
      url: https://github.com/re7gog/android_system_font
      ref: master
  animations: ^2.1.2
  app_links: ^7.0.0
  background_fetch: ^1.6.0
  battery_plus: ^7.0.0
  bcrypt: ^1.2.0
  connectivity_plus: ^7.1.1
  crypto: ^3.0.7
  cupertino_icons: ^1.0.9
  device_info_plus: ^12.4.0
  dynamic_system_colors: ^1.9.0
  easy_localization: ^3.0.8
  equations: ^6.0.0
  file_picker: ^11.0.2
  flex_color_picker: ^3.8.0
  flutter:
    sdk: flutter
  flutter_archive: ^6.0.4
  flutter_charset_detector: ^5.0.0
  flutter_fgbg: ^0.8.0
  flutter_foreground_task: ^9.2.2
  flutter_lints: ^6.0.0
  flutter_local_notifications: ^21.0.0
  flutter_markdown_plus: ^1.0.7
  flutter_typeahead: ^6.0.0
  fluttertoast: ^9.0.0
  hsluv: ^1.1.3
  html: ^0.15.6
  http: ^1.6.0
  logger: ^2.6.2
  markdown: ^7.3.1
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  provider: ^6.1.5+1
  share_plus: ^12.0.2
  shared_preferences: ^2.5.5
  shared_storage: # TODO: Is this maintained?
    git:
      url: https://github.com/AlexBacich/shared-storage
      ref: master
  shizuku_apk_installer:
    git:
      url: https://github.com/re7gog/shizuku_apk_installer
      ref: master
  sqflite: ^2.4.2
  url_launcher: ^6.3.2
  webview_flutter: ^4.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter_launcher_icons:
  android: "ic_launcher"
  image_path: "assets/graphics/icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/translations/
    - assets/graphics/
    - assets/ca/

  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
